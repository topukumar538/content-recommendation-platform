services:

  db:
    image: postgres:16
    container_name: contentplatform_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: contentplatform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: contentplatform_app
    restart: always
    ports:
      - "8000:7860"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/contentplatform
    volumes:
      - ./backend:/home/user/app/backend
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: