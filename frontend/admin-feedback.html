<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin — Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f8fafc; }
        h1, h2 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white border-b border-gray-100 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-blue-700 text-xl">ContentPlatform</h1>
        <div class="flex items-center gap-4">
            <a href="/app/admin.html" class="text-sm text-gray-500 hover:text-gray-700">← Admin Panel</a>
            <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">Logout</button>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto mt-10 px-4 pb-20">
        <h2 class="text-gray-800 text-3xl mb-2">Feedback</h2>
        <p class="text-gray-400 text-sm mb-8 font-light">User submitted feedback</p>
        <div id="feedback-list"></div>
    </div>

    <script>
        async function checkAdmin() {
            const res = await fetch("/auth/me", { credentials: "include" })
            if (!res.ok) return window.location.href = "/app/login.html"
            const user = await res.json()
            if (user.role !== "admin") window.location.href = "/app/feed.html"
        }

        async function loadFeedback() {
            const res = await fetch("/admin/feedback", { credentials: "include" })
            if (!res.ok) return
            const feedbacks = await res.json()
            const container = document.getElementById("feedback-list")

            if (feedbacks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 text-gray-400">
                        <div class="text-5xl mb-4">💬</div>
                        <p>No feedback yet.</p>
                    </div>`
                return
            }

            container.innerHTML = feedbacks.map(f => `
                <div class="bg-white rounded-xl p-6 shadow-sm mb-4 ${f.is_resolved ? 'opacity-60' : ''}">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-700 text-sm font-bold">
                                ${f.username[0].toUpperCase()}
                            </div>
                            <div>
                                <p class="text-gray-700 text-sm font-medium">${f.username}</p>
                                <p class="text-gray-400 text-xs">${f.email}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-yellow-400">${"★".repeat(f.rating)}${"☆".repeat(5 - f.rating)}</span>
                            ${f.is_resolved
                                ? '<span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded-full">Resolved</span>'
                                : '<span class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded-full">Pending</span>'
                            }
                        </div>
                    </div>
                    <p class="text-gray-600 text-sm leading-relaxed mb-4">${f.message}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-300 text-xs">${f.created_at.substring(0, 10)}</span>
                        <div class="flex gap-2">
                            <button onclick="resolve(${f.id})"
                                class="text-xs px-3 py-1 rounded-lg border ${f.is_resolved ? 'border-yellow-300 text-yellow-600 hover:bg-yellow-50' : 'border-green-300 text-green-600 hover:bg-green-50'} transition">
                                ${f.is_resolved ? "Unresolve" : "Resolve"}
                            </button>
                            <button onclick="deleteFeedback(${f.id})"
                                class="text-xs px-3 py-1 rounded-lg border border-red-300 text-red-500 hover:bg-red-50 transition">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join("")
        }

        async function resolve(id) {
            const res = await fetch(`/admin/feedback/${id}/resolve`, {
                method: "PATCH",
                credentials: "include"
            })
            if (res.ok) loadFeedback()
        }

        async function deleteFeedback(id) {
            if (!confirm("Delete this feedback?")) return
            const res = await fetch(`/admin/feedback/${id}`, {
                method: "DELETE",
                credentials: "include"
            })
            if (res.ok) loadFeedback()
        }

        async function logout() {
            await fetch("/auth/logout", { method: "POST", credentials: "include" })
            window.location.href = "/app/index.html"
        }

        checkAdmin()
        loadFeedback()
    </script>
</body>
</html>
