<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin — Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8fafc;
        }

        h1,
        h2 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="min-h-screen">

    <nav class="bg-white border-b border-gray-100 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-blue-700 text-xl">ContentPlatform</h1>
        <div class="flex items-center gap-4">
            <a href="/app/admin.html" class="text-sm text-gray-500 hover:text-gray-700">← Admin Panel</a>
            <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">Logout</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 px-4 pb-20">
        <h2 class="text-gray-800 text-3xl mb-2">User Management</h2>
        <p class="text-gray-400 text-sm mb-8 font-light">View, block and delete users</p>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-100">
                    <tr>
                        <th class="text-left px-6 py-4 text-gray-500 font-medium">User</th>
                        <th class="text-left px-6 py-4 text-gray-500 font-medium">Email</th>
                        <th class="text-left px-6 py-4 text-gray-500 font-medium">Status</th>
                        <th class="text-left px-6 py-4 text-gray-500 font-medium">Joined</th>
                        <th class="text-left px-6 py-4 text-gray-500 font-medium">Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function checkAdmin() {
            const res = await fetch("/auth/me", { credentials: "include" })
            if (!res.ok) return window.location.href = "/app/login.html"
            const user = await res.json()
            if (user.role !== "admin") window.location.href = "/app/feed.html"
        }

        async function loadUsers() {
            const res = await fetch("/admin/users", { credentials: "include" })
            if (!res.ok) return
            const users = await res.json()
            const tbody = document.getElementById("user-table")

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-gray-400">No users found</td></tr>`
                return
            }

            tbody.innerHTML = users.map(u => `
                <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-700 text-sm font-bold">
                                ${u.username[0].toUpperCase()}
                            </div>
                            <span class="text-gray-700 font-medium">${u.username}</span>
                            ${u.role === "admin" ? '<span class="text-xs bg-purple-100 text-purple-600 px-2 py-0.5 rounded-full">admin</span>' : ""}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-gray-500">${u.email}</td>
                    <td class="px-6 py-4">
                        ${u.is_blocked
                    ? '<span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full">Blocked</span>'
                    : u.is_active
                        ? '<span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded-full">Active</span>'
                        : '<span class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded-full">Unverified</span>'
                }
                    </td>
                    <td class="px-6 py-4 text-gray-400 text-xs">${u.created_at.substring(0, 10)}</td>
                    <td class="px-6 py-4">
                        ${u.role !== "admin" ? `
                            <div class="flex gap-2">
                                <button onclick="toggleBlock(${u.id})"
                                    class="text-xs px-3 py-1 rounded-lg border ${u.is_blocked ? 'border-green-300 text-green-600 hover:bg-green-50' : 'border-orange-300 text-orange-600 hover:bg-orange-50'} transition">
                                    ${u.is_blocked ? "Unblock" : "Block"}
                                </button>
                                <button onclick="deleteUser(${u.id})"
                                    class="text-xs px-3 py-1 rounded-lg border border-red-300 text-red-500 hover:bg-red-50 transition">
                                    Delete
                                </button>
                            </div>
                        ` : '<span class="text-gray-300 text-xs">—</span>'}
                    </td>
                </tr>
            `).join("")
        }

        async function toggleBlock(userId) {
            const res = await fetch(`/admin/users/${userId}/block`, {
                method: "PATCH",
                credentials: "include"
            })
            if (res.ok) loadUsers()
        }

        async function deleteUser(userId) {
            if (!confirm("Are you sure you want to delete this user?")) return
            const res = await fetch(`/admin/users/${userId}`, {
                method: "DELETE",
                credentials: "include"
            })
            if (res.ok) loadUsers()
        }

        async function logout() {
            await fetch("/auth/logout", { method: "POST", credentials: "include" })
            window.location.href = "/app/index.html"
        }

        checkAdmin()
        loadUsers()
    </script>
</body>

</html>
