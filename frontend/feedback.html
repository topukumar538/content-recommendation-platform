<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f8fafc; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .star { font-size: 32px; cursor: pointer; transition: transform 0.1s; color: #d1d5db; }
        .star:hover, .star.active { color: #f59e0b; transform: scale(1.2); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white border-b border-gray-100 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-blue-700 text-xl">ContentPlatform</h1>
        <div class="flex items-center gap-4">
            <a href="/app/feed.html" class="text-sm text-gray-500 hover:text-gray-700">← Back to Feed</a>
            <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">Logout</button>
        </div>
    </nav>

    <div class="max-w-xl mx-auto mt-10 px-4 pb-20">
        <div class="bg-white rounded-2xl p-10 shadow-sm">
            <div class="text-center mb-8">
                <div class="text-5xl mb-4">💬</div>
                <h2 class="text-gray-800 text-3xl mb-2">Send Feedback</h2>
                <p class="text-gray-400 text-sm font-light">Help us improve ContentPlatform</p>
            </div>

            <div id="error" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>
            <div id="success" class="hidden bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>

            <!-- Star Rating -->
            <div class="mb-6">
                <label class="block text-gray-600 text-sm mb-3 font-medium">Rating</label>
                <div class="flex gap-2 justify-center" id="stars">
                    <span class="star" onclick="setRating(1)">★</span>
                    <span class="star" onclick="setRating(2)">★</span>
                    <span class="star" onclick="setRating(3)">★</span>
                    <span class="star" onclick="setRating(4)">★</span>
                    <span class="star" onclick="setRating(5)">★</span>
                </div>
                <p id="rating-text" class="text-center text-gray-400 text-sm mt-2">Click to rate</p>
            </div>

            <!-- Message -->
            <div class="mb-6">
                <label class="block text-gray-600 text-sm mb-2 font-medium">Message</label>
                <textarea id="message" rows="4" placeholder="Tell us what you think..."
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm outline-none focus:border-blue-500 resize-none"></textarea>
            </div>

            <button onclick="submitFeedback()" id="btn"
                class="w-full bg-blue-700 text-white py-3 rounded-lg text-sm font-semibold hover:bg-blue-800 disabled:opacity-50 transition">
                Submit Feedback
            </button>
        </div>
    </div>

    <script>
        let selectedRating = 0

        const ratingLabels = {
            1: "Poor ⭐",
            2: "Fair ⭐⭐",
            3: "Good ⭐⭐⭐",
            4: "Very Good ⭐⭐⭐⭐",
            5: "Excellent ⭐⭐⭐⭐⭐"
        }

        function setRating(rating) {
            selectedRating = rating
            const stars = document.querySelectorAll(".star")
            // highlight stars up to selected
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add("active")
                } else {
                    star.classList.remove("active")
                }
            })
            document.getElementById("rating-text").textContent = ratingLabels[rating]
        }

        function fmtDetail(detail) {
            if (Array.isArray(detail)) return detail.map(e => e.msg || JSON.stringify(e)).join(", ")
            if (detail && typeof detail === "object") return JSON.stringify(detail)
            return detail || "Something went wrong"
        }

        function showError(msg) {
            const el = document.getElementById("error")
            el.textContent = fmtDetail(msg)
            el.classList.remove("hidden")
            document.getElementById("success").classList.add("hidden")
        }

        function showSuccess(msg) {
            const el = document.getElementById("success")
            el.textContent = msg
            el.classList.remove("hidden")
            document.getElementById("error").classList.add("hidden")
        }

        async function submitFeedback() {
            const message = document.getElementById("message").value.trim()

            if (selectedRating === 0) return showError("Please select a rating")
            if (!message) return showError("Please write a message")

            const btn = document.getElementById("btn")
            btn.textContent = "Submitting..."
            btn.disabled = true

            try {
                const res = await fetch("/user/feedback", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ message, rating: selectedRating })
                })

                const data = await res.json()

                if (res.ok) {
                    showSuccess("Thank you for your feedback!")
                    document.getElementById("message").value = ""
                    setRating(0)
                    selectedRating = 0
                    document.querySelectorAll(".star").forEach(s => s.classList.remove("active"))
                    document.getElementById("rating-text").textContent = "Click to rate"
                } else {
                    showError(data.detail)
                }
            } finally {
                btn.textContent = "Submit Feedback"
                btn.disabled = false
            }
        }

        async function logout() {
            await fetch("/auth/logout", { method: "POST", credentials: "include" })
            window.location.href = "/app/index.html"
        }
    </script>
</body>
</html>
