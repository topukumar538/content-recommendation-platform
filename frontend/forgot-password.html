<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password — ContentPlatform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h2 { font-family: 'Playfair Display', serif; }
        .hero-bg { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 40%, #3b82f6 100%); }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.25); }
        .input-field { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; font-size: 14px; outline: none; transition: border 0.2s; font-family: 'DM Sans', sans-serif; }
        .input-field:focus { border-color: #1d4ed8; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: white; padding: 13px; border-radius: 10px; font-weight: 500; font-size: 15px; border: none; cursor: pointer; transition: opacity 0.2s; font-family: 'DM Sans', sans-serif; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen hero-bg flex items-center justify-center px-4">
    <div class="glass rounded-2xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🔑</div>
            <h2 class="text-gray-800 text-3xl mb-2">Forgot Password</h2>
            <p class="text-gray-500 text-sm font-light">Enter your email and we'll send you a reset code</p>
        </div>

        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>
        <div id="success" class="hidden bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>

        <div class="mb-6">
            <label class="block text-gray-600 text-sm mb-2 font-medium">Email</label>
            <input id="email" type="email" placeholder="you@example.com"
                class="input-field"
                onkeydown="if(event.key==='Enter') sendOTP()"/>
        </div>

        <button onclick="sendOTP()" id="btn" class="btn-primary">
            Send Reset Code
        </button>

        <p class="text-center text-sm text-gray-500 mt-6">
            <a href="/app/login.html" class="text-blue-600 hover:underline">Back to Login</a>
        </p>
    </div>

    <script>
        function showError(msg) {
            const el = document.getElementById("error")
            el.textContent = msg
            el.classList.remove("hidden")
            document.getElementById("success").classList.add("hidden")
        }

        function fmtDetail(detail) {
            if (Array.isArray(detail)) return detail.map(e => e.msg || JSON.stringify(e)).join(", ")
            if (detail && typeof detail === "object") return JSON.stringify(detail)
            return detail || "Something went wrong"
        }

        function showSuccess(msg) {
            const el = document.getElementById("success")
            el.textContent = fmtDetail(msg)
            el.classList.remove("hidden")
            document.getElementById("error").classList.add("hidden")
        }

        async function sendOTP() {
            const email = document.getElementById("email").value.trim()
            if (!email) return showError("Please enter your email")

            const btn = document.getElementById("btn")
            btn.textContent = "Sending..."
            btn.disabled = true

            try {
                const res = await fetch("/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email })
                })
                const data = await res.json()
                if (res.ok) {
                    showSuccess("Reset code sent to your email!")
                    localStorage.setItem("verify_email", email)
                    localStorage.setItem("verify_purpose", "forgot_password")
                    setTimeout(() => window.location.href = "/app/reset-password.html", 1500)
                } else {
                    showError(data.detail)
                }
            } finally {
                btn.textContent = "Send Reset Code"
                btn.disabled = false
            }
        }
    </script>
</body>
</html>
