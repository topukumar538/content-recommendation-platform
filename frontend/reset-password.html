<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password — ContentPlatform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h2 { font-family: 'Playfair Display', serif; }
        .hero-bg { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 40%, #3b82f6 100%); }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.25); }
        .input-field { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; font-size: 14px; outline: none; transition: border 0.2s; font-family: 'DM Sans', sans-serif; }
        .input-field:focus { border-color: #1d4ed8; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: white; padding: 13px; border-radius: 10px; font-weight: 500; font-size: 15px; border: none; cursor: pointer; transition: opacity 0.2s; font-family: 'DM Sans', sans-serif; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen hero-bg flex items-center justify-center px-4">
    <div class="glass rounded-2xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🔒</div>
            <h2 class="text-gray-800 text-3xl mb-2">Reset Password</h2>
            <p class="text-gray-500 text-sm font-light">Enter the code sent to <span id="email-display" class="text-blue-600 font-medium"></span></p>
        </div>

        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>
        <div id="success" class="hidden bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>

        <div class="mb-4">
            <label class="block text-gray-600 text-sm mb-2 font-medium">OTP Code</label>
            <input id="code" type="text" placeholder="6-digit code" maxlength="6"
                class="input-field text-center text-xl tracking-widest"
                onkeydown="if(event.key==='Enter') document.getElementById('new-password').focus()"/>
        </div>
        <div class="mb-4">
            <label class="block text-gray-600 text-sm mb-2 font-medium">New Password</label>
            <input id="new-password" type="password" placeholder="Min 6 characters"
                class="input-field"
                onkeydown="if(event.key==='Enter') document.getElementById('confirm-password').focus()"/>
        </div>
        <div class="mb-6">
            <label class="block text-gray-600 text-sm mb-2 font-medium">Confirm Password</label>
            <input id="confirm-password" type="password" placeholder="Repeat new password"
                class="input-field"
                onkeydown="if(event.key==='Enter') resetPassword()"/>
        </div>

        <button onclick="resetPassword()" id="btn" class="btn-primary">Reset Password</button>

        <div class="flex justify-between text-sm text-gray-500 mt-6">
            <a href="/app/forgot-password.html" class="text-blue-600 hover:underline">Resend code</a>
            <a href="/app/login.html" class="text-blue-600 hover:underline">Back to login</a>
        </div>
    </div>

    <script>

        const email = localStorage.getItem("verify_email")
        if (!email) window.location.href = "/app/forgot-password.html"
        document.getElementById("email-display").textContent = email

        // -----------------------------
        // ← ADD RIGHT HERE
        const bypassMsg = document.createElement("div")
        bypassMsg.className = "bg-yellow-50 border border-yellow-200 text-yellow-700 px-4 py-3 rounded-lg mb-5 text-sm text-center"
        bypassMsg.innerHTML = "⚠️ SMTP bypassed — use code <strong>123456</strong> to verify"
        document.getElementById("error").insertAdjacentElement("afterend", bypassMsg)
        document.getElementById("code").value = "123456"
        // -----------------------------
        
        function showError(msg) {
            const el = document.getElementById("error")
            el.textContent = msg
            el.classList.remove("hidden")
            document.getElementById("success").classList.add("hidden")
        }

        function showSuccess(msg) {
            const el = document.getElementById("success")
            el.textContent = msg
            el.classList.remove("hidden")
            document.getElementById("error").classList.add("hidden")
        }

        async function resetPassword() {
            const code = document.getElementById("code").value.trim()
            const new_password = document.getElementById("new-password").value
            const confirm_password = document.getElementById("confirm-password").value

            if (!code || code.length !== 6) return showError("Enter a valid 6-digit code")
            if (!new_password || !confirm_password) return showError("All fields are required")
            if (new_password.length < 6) return showError("Password must be at least 6 characters")
            if (new_password !== confirm_password) return showError("Passwords do not match")

            const btn = document.getElementById("btn")
            btn.textContent = "Resetting..."
            btn.disabled = true

            try {
                const res = await fetch("/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email, code, new_password, confirm_password })
                })
                const data = await res.json()
                if (res.ok) {
                    showSuccess("Password reset successfully! Redirecting to login...")
                    localStorage.removeItem("verify_email")
                    localStorage.removeItem("verify_purpose")
                    setTimeout(() => window.location.href = "/app/login.html", 2000)
                } else {
                    showError(data.detail)
                }
            } finally {
                btn.textContent = "Reset Password"
                btn.disabled = false
            }
        }
    </script>
</body>
</html>
