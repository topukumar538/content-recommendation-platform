<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup — ContentPlatform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .hero-bg { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 40%, #3b82f6 100%); }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.25); }
        .input-field { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; font-size: 14px; outline: none; transition: border 0.2s; font-family: 'DM Sans', sans-serif; }
        .input-field:focus { border-color: #1d4ed8; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: white; padding: 13px; border-radius: 10px; font-weight: 500; font-size: 15px; border: none; cursor: pointer; transition: opacity 0.2s; font-family: 'DM Sans', sans-serif; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .slide-in { animation: slideIn 0.6s ease forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="min-h-screen hero-bg flex">

    <!-- Left -->
    <div class="hidden lg:flex flex-1 flex-col justify-center px-16">
        <h1 class="text-white text-4xl mb-4">Join us today.</h1>
        <p class="text-blue-200 text-lg font-light max-w-sm">Create your account and start discovering content tailored just for you.</p>
    </div>

    <!-- Right -->
    <div class="flex-1 flex items-center justify-center px-6 py-12">
        <div class="glass rounded-2xl p-10 w-full max-w-md slide-in">
            <div class="mb-8">
                <h2 class="text-gray-800 text-3xl mb-1">Create account</h2>
                <p class="text-gray-500 text-sm font-light">Fill in your details to get started</p>
            </div>

            <div id="error" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>
            <div id="success" class="hidden bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-lg mb-5 text-sm"></div>

            <div class="mb-4">
                <label class="block text-gray-600 text-sm mb-2 font-medium">Username</label>
                <input id="username" type="text" placeholder="Your name" class="input-field"/>
            </div>
            <div class="mb-4">
                <label class="block text-gray-600 text-sm mb-2 font-medium">Email</label>
                <input id="email" type="email" placeholder="you@example.com" class="input-field"/>
            </div>
            <div class="mb-6">
                <label class="block text-gray-600 text-sm mb-2 font-medium">Password</label>
                <input id="password" type="password" placeholder="Min 6 characters" class="input-field"/>
            </div>

            <button onclick="signup()" id="btn" class="btn-primary">Create Account</button>

            <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account?
                <a href="/app/login.html" class="text-blue-600 hover:underline font-medium">Sign in</a>
            </p>
        </div>
    </div>

    <script>
        function showError(msg) {
            const el = document.getElementById("error")
            el.textContent = msg
            el.classList.remove("hidden")
            document.getElementById("success").classList.add("hidden")
        }
        function showSuccess(msg) {
            const el = document.getElementById("success")
            el.textContent = msg
            el.classList.remove("hidden")
            document.getElementById("error").classList.add("hidden")
        }
        async function signup() {
            const username = document.getElementById("username").value.trim()
            const email = document.getElementById("email").value.trim()
            const password = document.getElementById("password").value
            if (!username || !email || !password) return showError("All fields are required")
            if (password.length < 6) return showError("Password must be at least 6 characters")
            const btn = document.getElementById("btn")
            btn.textContent = "Sending OTP..."
            btn.disabled = true
            try {
                const res = await fetch("/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ username, email, password })
                })
                const data = await res.json()
                if (res.ok) {
                    showSuccess("OTP sent to your email!")
                    localStorage.setItem("verify_email", email)
                    localStorage.setItem("verify_purpose", "signup")
                    setTimeout(() => window.location.href = "/app/verify.html", 1500)
                } else {
                    showError(data.detail)
                }
            } finally {
                btn.textContent = "Create Account"
                btn.disabled = false
            }
        }
    </script>
</body>
</html>
